[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-engineering-studio"
version = "0.1.0"
description = "Design and analyze human IgG Fc variant sequences based on EU Numbering - a Textual TUI for antibody Fc engineering"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pyperclip>=1.11.0",
    "pyyaml>=6.0.3",
    "textual>=8.2.3",
]

[project.scripts]
fc-engineer = "fc_engineer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fc_engineer = ["data/*.yaml"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
