[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fc-engineering-studio"
version = "0.1.0"
description = "Flet-based visual antibody & Fc engineering desktop application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flet[desktop]>=0.86.0",
    "pillow>=11.0.0",
    "pyperclip>=1.11.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
fc-engineer = "fc_engineer.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fc_engineer = ["data/*.yaml"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
