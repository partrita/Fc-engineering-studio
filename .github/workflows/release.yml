name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-python:
    name: Test & Build Python Distributions
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      - name: Verify tag matches package version
        run: |
          uv run --python 3.12 python - <<'EOF'
          import os
          import tomllib
          from pathlib import Path
          import fc_engineer

          tag_name = os.environ["GITHUB_REF_NAME"]
          if not tag_name.startswith("v"):
              raise SystemExit(f"Expected tag starting with 'v', got {tag_name!r}")

          tag_version = tag_name.removeprefix("v")
          with Path("pyproject.toml").open("rb") as f:
              project_version = tomllib.load(f)["project"]["version"]
          pkg_version = fc_engineer.__version__

          assert tag_version == project_version == pkg_version, (
              f"Version mismatch: tag={tag_name!r}, pyproject={project_version!r}, __init__={pkg_version!r}"
          )
          print(f"Verified version parity: {tag_name} == {project_version} == {pkg_version}")
          EOF

      - name: Run Bandit security scan
        run: uv run --python 3.12 bandit -r src/

      - name: Run test suite
        run: uv run --python 3.12 pytest

      - name: Build wheel and sdist
        run: |
          rm -rf dist
          uv build --python 3.12

      - name: Upload Python distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: build-python
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            archive_suffix: linux-x86_64.tar.gz
            add_data_sep: ":"
          - os: macos-latest
            archive_suffix: macos-arm64.tar.gz
            add_data_sep: ":"
          - os: windows-latest
            archive_suffix: windows-x86_64.zip
            add_data_sep: ";"
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --locked --python 3.12

      - name: Install PyInstaller and flet-cli
        run: uv pip install pyinstaller flet-cli==1.1.2

      - name: Patch flet-cli 1.1.2 Windows binary-mode open bug
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          uv run --no-sync --python 3.12 python - <<'EOF'
          from pathlib import Path
          import flet_cli

          win_utils = Path(list(flet_cli.__path__)[0]) / "__pyinstaller" / "win_utils.py"
          src = win_utils.read_text(encoding="utf-8")
          buggy = 'open(exe_path, "ab", encoding="utf-8")'
          if buggy in src:
              win_utils.write_text(src.replace(buggy, 'open(exe_path, "ab")'), encoding="utf-8")
              print(f"Patched upstream binary-mode open bug in {win_utils}")
          EOF

      - name: Package standalone app with flet pack
        shell: bash
        run: |
          uv run --no-sync --python 3.12 flet pack src/fc_engineer/app.py \
            --name fc-engineer \
            --add-data "src/fc_engineer/data/*.yaml${{ matrix.add_data_sep }}fc_engineer/data" \
            --yes \
            -- \
            --exclude-module tkinter \
            --exclude-module sqlite3 \
            --exclude-module unittest \
            --exclude-module pydoc \
            --exclude-module doctest \
            --exclude-module curses \
            --exclude-module xmlrpc \
            --exclude-module pytest \
            --exclude-module bandit \
            --exclude-module PIL.ImageTk \
            --exclude-module PIL.ImageQt

      - name: Archive standalone bundle
        shell: bash
        run: |
          mkdir -p release-assets
          ARCHIVE="release-assets/fc-engineer-${GITHUB_REF_NAME}-${{ matrix.archive_suffix }}"
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            7z a -tzip "$ARCHIVE" ./dist/*
          else
            tar -czf "$ARCHIVE" -C dist .
          fi

      - name: Upload desktop archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: release-assets/*

  publish-release:
    name: Publish GitHub Release
    needs: [build-python, build-desktop]
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        run: (cd all-artifacts && sha256sum * > SHA256SUMS.txt)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: all-artifacts/*
